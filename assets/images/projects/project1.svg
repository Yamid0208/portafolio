      <rect x="454" y="6" width="68" height="18" rx="9" fill="rgba(34, 197, 94, 0.15)"/>
      <text x="466" y="19" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9.5" font-weight="700">ÓPTIMO</text>
