  <rect x="44" y="80" width="270" height="256" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="64" y="108" fill="#10b981" font-family="'Inter', sans-serif" font-size="12" font-weight="700">FLUX ASÍNCRONO REACTIVO</text>
  <text x="64" y="132" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="700">RxJS &amp; NgRx Suite</text>
  
  <!-- Stream 1 -->
  <line x1="64" y1="160" x2="290" y2="160" stroke="#10b981" stroke-width="2"/>
  <circle cx="90" cy="160" r="7" fill="#10b981"/>
  <circle cx="150" cy="160" r="7" fill="#38bdf8"/>
  <circle cx="230" cy="160" r="7" fill="#f59e0b"/>
  
  <!-- Stream 2 -->
  <line x1="64" y1="200" x2="290" y2="200" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="110" cy="200" r="7" fill="#38bdf8"/>
  <circle cx="190" cy="200" r="7" fill="#ec4899"/>
  <circle cx="270" cy="200" r="7" fill="#10b981"/>

  <!-- CombineLatest / Pipe Box -->
  <rect x="64" y="235" width="226" height="42" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="177" y="261" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">combineLatest([state$, filters$])</text>

  <text x="64" y="310" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Zero Memory Leaks · OnPush Strategy</text>

  <!-- Right Side: Tailwind CSS UI Components -->
