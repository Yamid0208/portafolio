  <circle cx="48" cy="44" r="5" fill="#ef4444"/>
  <circle cx="66" cy="44" r="5" fill="#f59e0b"/>
  <circle cx="84" cy="44" r="5" fill="#10b981"/>
  <rect x="180" y="34" width="240" height="20" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="300" y="48" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">reactive-stream.dev/dashboard</text>

