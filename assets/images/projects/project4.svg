  <text x="350" y="108" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">UI MODERNA</text>
  <text x="350" y="132" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Tailwind CSS &amp; Grid</text>
  <text x="350" y="156" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Maquetación fluida y adaptable con microinteracciones y feedback en tiempo real.</text>

