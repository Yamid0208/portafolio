  <rect x="350" y="275" width="186" height="34" rx="6" fill="rgba(244, 63, 94, 0.1)" stroke="rgba(244, 63, 94, 0.3)"/>
  <text x="365" y="296" fill="#fb7185" font-family="'Inter', sans-serif" font-size="11">🔥 High-Speed State Sync</text>
