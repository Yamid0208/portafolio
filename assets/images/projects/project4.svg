<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#061d28"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="20" fill="url(#p4Grad)"/>
  
  <rect x="24" y="24" width="552" height="332" rx="14" fill="#051016" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
