<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="20" fill="url(#bgInv)"/>
  <rect x="1" y="1" width="598" height="378" rx="19" fill="none" stroke="rgba(234, 179, 8, 0.25)" stroke-width="1.5"/>

  <!-- Top App Bar -->
  <rect x="20" y="18" width="560" height="42" rx="10" fill="#27272a" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="42" cy="39" r="6" fill="#ef4444"/>
  <circle cx="58" cy="39" r="6" fill="#eab308"/>
  <circle cx="74" cy="39" r="6" fill="#22c55e"/>

  <rect x="100" y="27" width="220" height="24" rx="6" fill="#18181b"/>
  <text x="112" y="43" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="500">yamid0208.github.io/Invitacion</text>

  <rect x="440" y="27" width="125" height="24" rx="12" fill="rgba(234, 179, 8, 0.15)" stroke="rgba(234, 179, 8, 0.4)"/>
  <circle cx="454" cy="39" r="4" fill="#eab308"/>
  <text x="466" y="43" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10.5" font-weight="700">GITHUB PAGES</text>

  <!-- Hero Invitation Card Mockup -->
  <g transform="translate(130, 75)">
    <rect width="340" height="285" rx="16" fill="#18181b" stroke="rgba(234, 179, 8, 0.3)"/>

    <!-- Subtle Golden Border Ornament -->
    <rect x="10" y="10" width="320" height="265" rx="10" fill="none" stroke="rgba(234, 179, 8, 0.2)" stroke-dasharray="4 4"/>

    <text x="170" y="48" fill="#eab308" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">ESTÁS CORDIALMENTE INVITADO</text>
    
    <text x="170" y="90" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="28" font-weight="700" text-anchor="middle">Nuestra Boda</text>
    <text x="170" y="112" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-style="italic" text-anchor="middle">Celebrando un momento inolvidable</text>

    <!-- Countdown Timer Boxes -->
    <g transform="translate(35, 130)">
      <rect width="58" height="48" rx="8" fill="#27272a"/>
      <text x="29" y="26" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="16" font-weight="800" text-anchor="middle">12</text>
      <text x="29" y="40" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" text-anchor="middle">DÍAS</text>

      <rect x="70" width="58" height="48" rx="8" fill="#27272a"/>
      <text x="99" y="26" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="16" font-weight="800" text-anchor="middle">08</text>
      <text x="99" y="40" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" text-anchor="middle">HORAS</text>

      <rect x="140" width="58" height="48" rx="8" fill="#27272a"/>
      <text x="169" y="26" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="16" font-weight="800" text-anchor="middle">45</text>
      <text x="169" y="40" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" text-anchor="middle">MIN</text>

      <rect x="210" width="58" height="48" rx="8" fill="#27272a"/>
      <text x="239" y="26" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="16" font-weight="800" text-anchor="middle">30</text>
      <text x="239" y="40" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" text-anchor="middle">SEG</text>
    </g>

    <!-- RSVP Button -->
    <g transform="translate(70, 198)">
      <rect width="200" height="38" rx="19" fill="url(#goldGrad)"/>
      <text x="100" y="24" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11.5" font-weight="800" text-anchor="middle">CONFIRMAR ASISTENCIA (RSVP)</text>
    </g>

    <text x="170" y="260" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" text-anchor="middle">HTML5 · CSS3 Animaciones · JavaScript Responsive</text>
  </g>
</svg>